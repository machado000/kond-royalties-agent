# Catalogo semantico do agente KOND (royalties de artistas).
#
# STATUS: VALIDADO contra o banco real em 2026-07-21. Multiplas fontes
# (sources), cada uma mapeada a um schema.tabela em
# config/postgres_sources.yml::logical_sources (mesma chave). Cada fonte
# declara seus proprios metrics/dimensions, com `expression_hint` resolvendo
# para a coluna real (ou expressao SQL) naquela tabela especifica — nomes de
# coluna variam muito entre plataformas (ex.: artista e `artista` no DSU,
# `artist` na Orchard/Universal, `artist_name` na Warner Music,
# `creator_names` na Warner Chappell).
#
# `royalty_performance` (a view unificada) e a fonte padrao — usar para
# perguntas cross-plataforma/agregadas por artista+periodo+origem+tipo de
# royalty. As demais fontes (`*_detail`) sao dados "limpos" de UMA
# plataforma especifica, usados quando a pergunta pede granularidade que a
# view unificada nao tem (faixa, compositor, ISRC, territorio, DSP, etc.).
#
# REGRA CRITICA: nunca combinar/agregar `royalty_performance` com uma
# `*_detail`, nem duas `*_detail` entre si, na mesma consulta — sao os
# mesmos eventos em granularidades diferentes (duplicaria valores). Ver
# config/column_dictionary.yml para o detalhe completo.
#
# SEPARACAO ROYALTIES x FINANCEIRO (2026-07-24): Omie e um ERP financeiro
# (contas a pagar/receber), nao uma plataforma de audit de royalties — foi
# removido de `vw_ft_dados_analiticos_union`/`royalty_performance` (so
# tinha inclusao parcial/acidental ali, ver historico em TODO.md item 3).
# As duas familias de metrica agora tem chaves e rotulos deliberadamente
# distintos para nunca serem confundidas: fontes de royalty (
# `royalty_performance`, `dsu_detail`, `orchard_detail`, `somlivre_detail`,
# `universal_detail`, `warner_chappell_detail`, `warner_music_detail`) usam
# a chave/metrica `royalties` (rotulo "Royalties"/"Direitos autorais"); a
# fonte financeira (`omie_detail`) usa as chaves `revenue`/`cost` (rotulos
# "Receita"/"Custo"). Nunca somar/comparar `royalties` com `revenue`/`cost`
# na mesma resposta sem deixar explicito que sao dominios diferentes.

sources:

  royalty_performance:
    default: true
    description: >
      View unificada de performance de royalties por artista, periodo
      (mes), origem (sistema/distribuidora) e tipo de royalty. Cobre
      streaming/publishing/master (Orchard, Universal, Warner Chappell,
      Warner Music) e shows ao vivo (DSU). NAO inclui o financeiro/ERP
      Omie — Omie e um dominio diferente (financeiro, nao royalty), usar a
      fonte `omie_detail` para perguntas de receita/custo/fluxo de caixa.
      Fonte padrao para perguntas cross-plataforma/agregadas de royalty.
      Nao tem dimensao de faixa/musica/compositor/ISRC/territorio — usar
      uma fonte `*_detail` quando a pergunta pedir esse nivel de detalhe.
    metrics:
      quantity:
        label: Quantidade
        description: >
          Quantidade associada a linha. O significado varia por
          origem/tipo de royalty (streams, unidades vendidas, contagem de
          shows, etc.) — ver config/column_dictionary.yml.
        expression_hint: sum(quantidade)
      royalties:
        label: Royalties
        description: >
          Valor de royalties/direitos autorais associado a linha. Nunca
          combinar/comparar com `revenue`/`cost` de `omie_detail` — sao
          dominios financeiros diferentes.
        expression_hint: sum(valor_royalties)
    dimensions:
      period:
        label: Periodo
        description: Mes de referencia, formato 'AAAA-MM' (grao mensal, nao diario).
        expression_hint: periodo
      artist:
        label: Artista
        description: Nome do artista normalizado (casado contra o cadastro de artistas).
        expression_hint: artista
      origem:
        label: Origem
        description: >
          Sistema/distribuidora de origem da linha (DSU, Orchard,
          Universal, Warner Chappell, Warner Music). Omie NAO aparece
          aqui (removido de `vw_ft_dados_analiticos_union` em 2026-07-24
          — era uma inclusao parcial/acidental, ver TODO.md item 3); usar
          `omie_detail` para dados financeiros Omie.
        expression_hint: plataforma_origem
      revenue_type:
        label: Tipo de royalty
        description: Categoria do royalty (Editora, Gravadora, Publicidade, Shows, N/D).
        expression_hint: tipo_remuneracao
      gravadora:
        label: Gravadora
        description: >
          Gravadora/selo associado ao artista (via matched_artista_id ->
          dim_artistas.gravadora). Esparso: so 36 de 660 artistas cadastrados
          tem gravadora preenchida, mas cobre a maior parte da receita
          (os poucos artistas com gravadora concentram grande parte do
          faturamento) — linhas sem match aparecem como null.
        expression_hint: "(select da.gravadora from dim_artistas da where da.id = matched_artista_id)"

  dsu_detail:
    description: >
      Contratos e shows ao vivo (DSU). Sem dimensao de faixa/musica —
      artista e data apenas, mais detalhe de local/evento/contrato. Fonte
      `vw_dsu_contratos_calendario` ja deduplicada por contrato (linha
      mais recente por status) — `count(*)` conta contratos reais, sem
      risco de contagem dupla.
    metrics:
      royalties:
        label: Royalties
        expression_hint: sum(valor_liquido)
      shows:
        label: Shows
        description: Numero de shows/contratos (contagem de linhas, ja deduplicada por contrato).
        expression_hint: count(*)
    dimensions:
      period:
        label: Periodo
      artist:
        label: Artista
        expression_hint: artista
        description: "Nome bruto do artista (formato 'CODIGO - Nome Artistico') — sem match contra dim_artistas."
      territory:
        label: UF
        expression_hint: uf
      city:
        label: Cidade
        expression_hint: cidade
      venue:
        label: Local
        expression_hint: local
      status:
        label: Status
        description: >
          CONFIRMADO, FINANCEIRO/AGUARDAR (aguardando confirmacao
          financeira, data ja reservada), CANCELADO/REMARCAR (cancelado —
          data livre novamente) ou QUALIDADE (1 linha isolada).
        expression_hint: status
      contratante:
        label: Contratante
        description: Parte contratante do show.
        expression_hint: contratante
      vendedor:
        label: Vendedor
        description: Responsavel comercial pela venda do contrato.
        expression_hint: vendedor
      tipo_evento:
        label: Tipo de evento
        expression_hint: tipo_evento
      dia_critico:
        label: Dia critico
        description: >
          Se a data do show cai num "dia critico" (sexta, sabado ou
          vespera de feriado — as melhores noites para um show, ja que o
          publico nao precisa acordar cedo no dia seguinte). Null para
          shows antes de 2026-01-01 (fora da cobertura de dim_calendario).
        expression_hint: dia_critico

  omie_detail:
    description: >
      Financeiro/ERP Omie (contas a pagar/receber) — dominio financeiro,
      NAO royalty (ver nota de separacao no topo deste arquivo). Sem
      dimensao de faixa/musica; artista e apenas um proxy (projeto Omie),
      nao normalizado.
    metrics:
      revenue:
        label: Receita
        description: >
          Receita bruta (soma das linhas com valor_liquido positivo).
          Nunca combinar/comparar com `royalties` de outras fontes — sao
          dominios financeiros diferentes.
        expression_hint: "sum(case when valor_liquido >= 0 then valor_liquido else 0 end)"
      cost:
        label: Custo
        description: >
          Custo/despesa (soma, em valor absoluto, das linhas com
          valor_liquido negativo).
        expression_hint: "sum(case when valor_liquido <= 0 then valor_liquido * -1 else 0 end)"
      resultado:
        label: Resultado
        description: Resultado liquido (receita - custo, soma direta de valor_liquido).
        expression_hint: sum(valor_liquido)
      payable:
        label: A pagar/receber
        expression_hint: sum(a_pagar_ou_receber)
    dimensions:
      period:
        label: Periodo
        description: >
          Derivado de `data_de_vencimento` (coluna DATE real, diferente do
          formato TEXT 'AAAA-MM' das demais fontes).
        expression_hint: "to_char(data_de_vencimento, 'YYYY-MM')"
      artist:
        label: Projeto (proxy de artista)
        expression_hint: projeto
        description: "Projeto Omie — proxy para artista, NAO normalizado contra dim_artistas."
      category:
        label: Categoria
        expression_hint: categoria
      type:
        label: Tipo
        expression_hint: tipo

  orchard_detail:
    description: >
      Reproducoes digitais Orchard. Tem faixa, ISRC, territorio e DSP —
      ausentes na view unificada.
    metrics:
      royalties:
        label: Royalties
        expression_hint: sum(valor_liquido_moeda_conta)
      quantity:
        label: Quantidade
        expression_hint: sum(quantidade)
    dimensions:
      period:
        label: Periodo
        expression_hint: periodo_relatorio
      artist:
        label: Artista
      track:
        label: Faixa
        expression_hint: titulo_musica
      isrc:
        label: ISRC
      territory:
        label: Territorio
        expression_hint: pais
      platform:
        label: Plataforma
        expression_hint: plataforma
      revenue_type:
        label: Tipo de royalty
        expression_hint: tipo_receita

  somlivre_detail:
    description: >
      Reproducoes digitais Som Livre/Sony Music. Tem faixa — ausente na
      view unificada. Confirmado (TODO.md item 1): esta fonte NAO esta
      incluida em `royalty_performance` — nao ha risco de duplicacao ao
      usa-la isoladamente, mas tambem nao ha como cruzar com origem='...'
      na view unificada (Som Livre simplesmente nao aparece la).
    metrics:
      royalties:
        label: Royalty liquido
        expression_hint: sum(royalty_liquido)
      quantity:
        label: Quantidade
        expression_hint: sum(unidades_de_pagamento)
    dimensions:
      period:
        label: Periodo
        expression_hint: data_extrato
      artist:
        label: Artista
        expression_hint: artista_da_faixa
        description: "Nome bruto — sem match contra dim_artistas."
      track:
        label: Faixa
        expression_hint: nome_da_faixa
      platform:
        label: Plataforma
        expression_hint: plataforma

  universal_detail:
    description: >
      Reproducoes digitais Universal Music. Tem faixa e compositor —
      ausentes na view unificada.
    metrics:
      royalties:
        label: Royalties a pagar
        expression_hint: sum(royalties_a_pagar)
      quantity:
        label: Unidades
        expression_hint: sum(unidades)
    dimensions:
      period:
        label: Periodo
        expression_hint: data_extrato
      artist:
        label: Artista
      track:
        label: Faixa
        expression_hint: titulo_musica
      composer:
        label: Compositor
        expression_hint: compositor
      platform:
        label: Plataforma
        expression_hint: plataforma
      revenue_type:
        label: Tipo de royalty
        expression_hint: tipo_receita

  warner_chappell_detail:
    description: >
      Statement Warner Chappell (publishing), tabela completa e atual
      (warner_chappell.stg_warner_statement — preferida a
      `ft_warner_statement`, que ficou congelada em 2025-12). Tem obra
      (work), compositor e territorio — ausentes na view unificada.
    metrics:
      royalties:
        label: Valor pago (liquido de impostos)
        expression_hint: sum(amount_paid_less_tax)
      quantity:
        label: Quantidade
        expression_hint: sum(units)
    dimensions:
      period:
        label: Periodo
        expression_hint: data_extrato
      artist:
        label: Criadores
        expression_hint: creator_names
        description: "Nomes dos criadores (raw, pode conter mais de um nome em uma linha)."
      track:
        label: Obra
        expression_hint: tango_work_title
      composer:
        label: Compositor
        expression_hint: composer
      territory:
        label: Territorio
        expression_hint: source_territory_name
      platform:
        label: Plataforma/canal
        description: >
          Descricao do canal de exploracao (via join com
          warner_chappell.dim_exploitation_source por
          income_provider_name+exploitation_source) — ex.: Spotify, Youtube,
          Radio, TV, Show.
        expression_hint: >-
          (select d.descricao_canal from warner_chappell.dim_exploitation_source d
          where d.income_provider_name = stg_warner_statement.income_provider_name
          and d.exploitation_source = stg_warner_statement.exploitation_source limit 1)
      revenue_type:
        label: Tipo de royalty
        expression_hint: tango_income_type_name

  warner_music_detail:
    description: >
      Reproducoes digitais Warner Music. Tem faixa, ISRC, DSP e territorio
      — ausentes na view unificada.
    metrics:
      royalties:
        label: Royalty a pagar
        expression_hint: sum(royalty_payable)
      quantity:
        label: Unidades vendidas
        expression_hint: sum(sale_units)
    dimensions:
      period:
        label: Periodo
        description: "Mes de recebimento (`recdate_month_id`). Existe tambem `repdate_month_id` (mes de reporte)."
        expression_hint: recdate_month_id
      artist:
        label: Artista
        expression_hint: artist_name
        description: "Nome bruto — sem match contra dim_artistas."
      track:
        label: Faixa
        expression_hint: tune_title
      isrc:
        label: ISRC
      territory:
        label: Territorio
        expression_hint: country
      platform:
        label: DSP
        expression_hint: digital_service_provider_dsp

# Fontes aprovadas para consulta — cada chave corresponde a uma entrada em
# config/postgres_sources.yml::logical_sources com o mesmo nome.
approved_sources:
  - royalty_performance
  - dsu_detail
  - omie_detail
  - orchard_detail
  - somlivre_detail
  - universal_detail
  - warner_chappell_detail
  - warner_music_detail
